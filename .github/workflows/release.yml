# Builds the installer on a Windows runner and publishes the GitHub release with BOTH assets the
# in-app updater needs: D-Island-Setup-<v>.exe and D-Island-Setup-<v>.exe.sha256.
#
#   - Push a tag v<x.y.z> (matching <Version> in DIsland.csproj) to release it, or
#   - run it by hand from the Actions tab with an existing tag (e.g. to rebuild v1.1.0).
#
# Release notes come from .github/release-notes.md ({VERSION} and {SHA256} are filled in).
name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and release, e.g. v1.1.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Check out the tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # Notes and this workflow live on main; a tag cut before they existed won't have them. Read the
      # one file with git: a second checkout inside the workspace would be compiled too (the csproj
      # globs every .cs file under it).
      - name: Get the release notes template from main
        shell: cmd   # byte-exact redirect; Windows PowerShell would re-encode the UTF-8 text
        run: |
          git fetch --depth=1 origin main
          git cat-file blob FETCH_HEAD:.github/release-notes.md > "%RUNNER_TEMP%\release-notes.md"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Check the tag matches the csproj version
        shell: powershell
        run: |
          $version = ([xml](Get-Content DIsland.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ("v$version" -ne $env:TAG) { throw "Tag $env:TAG doesn't match <Version>$version</Version> in DIsland.csproj" }
          "VERSION=$version" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install Inno Setup 6
        shell: powershell
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      # Windows PowerShell (not pwsh): the script draws the icon and wizard art with System.Drawing.
      - name: Build the installer
        shell: powershell
        run: .\tools\build-installer.ps1

      # pwsh: in Windows PowerShell, `gh release view`'s "not found" on stderr becomes a
      # terminating error under the runner's ErrorActionPreference=Stop.
      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $setup = "artifacts\D-Island-Setup-$env:VERSION.exe"
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash
          $notes = (Get-Content "$env:RUNNER_TEMP\release-notes.md" -Raw -Encoding utf8).Replace('{VERSION}', $env:VERSION).Replace('{SHA256}', $hash)
          [System.IO.File]::WriteAllText("$env:RUNNER_TEMP\notes.md", $notes)
          $ErrorActionPreference = 'Continue'
          gh release view $env:TAG 2>&1 | Out-Null
          $exists = $LASTEXITCODE -eq 0
          $ErrorActionPreference = 'Stop'
          if ($exists) {
            gh release upload $env:TAG $setup "$setup.sha256" --clobber
            gh release edit $env:TAG --notes-file "$env:RUNNER_TEMP\notes.md" --draft=false --latest
          } else {
            gh release create $env:TAG $setup "$setup.sha256" --title "D-Island $env:VERSION" --notes-file "$env:RUNNER_TEMP\notes.md" --latest
          }
          if ($LASTEXITCODE -ne 0) { throw "gh failed ($LASTEXITCODE)" }
